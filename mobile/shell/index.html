<!doctype html>
<html lang="en" data-shell-page>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f6fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a11" media="(prefers-color-scheme: dark)">
<!-- The page colour before the first paint (wave 4, m3). This page carries no inline CSS and no inline code: its CSP refuses both, and
     scripts/build-mobile.mjs stops the build on either. So the colour comes from the color-scheme meta above (the browser paints a dark
     canvas on a dark phone) and from the two stylesheets below, which block the first paint until they are read: the page and body
     background is the bg token, #f6f6fb light and #0a0a11 dark, the same colours as the theme-color metas. A theme chosen in Plenum
     (Dark on a light phone, Light on a dark one) is shown by shell.js before it does anything else (earlyTheme in app.js, from a copy of
     the theme it keeps in localStorage). The Android app paints its window and WebView in the same colours natively. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plenum">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' http: https: ws: wss:; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Plenum</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/app.svg" type="image/svg+xml">
<link rel="stylesheet" href="shell-tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="sh-app" class="sh-app"></div>
<script type="module" src="shell.js"></script>
<script type="module" src="screens.js"></script>
</body>
</html>
