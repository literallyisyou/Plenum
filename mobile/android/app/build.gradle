// Plenum's Android app. minSdk 26, compile and target 36 (variables.gradle). JDK 21 (capacitor.build.gradle).
//
// Signing: never a keystore in the repository. A release build is signed only when CI sets ANDROID_KEYSTORE_PATH (the
// decoded keystore in the runner's temp folder) together with ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
// ANDROID_KEY_PASSWORD (mobile.yml, release tags only). Without them the release build is unsigned and debug builds use
// the local debug key, as usual. Partial settings fail the build.
//
// Versions: release.yml passes -PplenumVersionCode=<int> (major*10000 + minor*100 + patch, from the tag) and -PplenumVersionName=<text>
// on its gradlew line. Without them (a local build, scripts/build-android.mjs) every build gets a higher versionCode than the one
// before and a versionName that names the day, so Capacitor's Bridge.isNewBinary() sees a new binary after each reinstall and
// copies the new web UI in, instead of keeping the old copied UI folder (wave 4, k1: "I reinstalled and nothing changed").

apply plugin: 'com.android.application'

def signingEnv = System.getenv('ANDROID_KEYSTORE_PATH')

// The local versionCode: whole minutes since 1 Jan 1970, minus 29,000,000 minutes (that offset is 19 Feb 2025, 21:20 UTC).
//   16 Nov 2026 00:00 UTC is 29,913,120 minutes since 1970, so a build that day is about 913,120: positive, rising by 1 a minute.
//   Android's ceiling is 2,100,000,000; at 525,960 minutes a year the code reaches it after (2,100,000,000 - 913,120) / 525,960,
//   about 3,990 years. The minute count itself fits an int (2,147,483,647) until about the year 6053.
// Two builds in the same minute share a code; the versionName below still differs only by the minute, which is fine for one phone.
def plenumLocalVersionCode = { ->
    int code = (int) (System.currentTimeMillis() / 60000L) - 29000000
    if (code < 1 || code >= 2100000000) throw new GradleException("The local versionCode came out as ${code}; check the computer's clock.")
    return code
}
// The local versionName: mobile/package.json's version + '-dev.' + the build's date and time, for example 0.5.0-dev.261116.1432.
def plenumLocalVersionName = { ->
    def pkg = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
    def stamp = new java.text.SimpleDateFormat('yyMMdd.HHmm').format(new Date())
    return "${pkg.version}-dev.${stamp}".toString()
}

android {
    namespace = "com.literallyisyou.plenum"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.literallyisyou.plenum"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode (project.hasProperty('plenumVersionCode') ? Integer.parseInt(project.property('plenumVersionCode').toString()) : plenumLocalVersionCode())
        versionName (project.hasProperty('plenumVersionName') ? project.property('plenumVersionName').toString() : plenumLocalVersionName())
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The phone build (-PplenumPhone, which scripts/build-android.mjs --phone passes) keeps only the libraries' English
        // resources: the app's own words are in its web UI, and the other languages' tables were a seventh of that APK. Other builds
        // keep every language.
        if (project.hasProperty('plenumPhone')) {
            resourceConfigurations += ['en']
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (signingEnv) {
                storeFile file(signingEnv)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        // The phone build (17 Nov 2026): the debug build made the way a shipped app is, for 64-bit ARM phones only (every Android
        // phone of the last years). It is not debuggable, so R8 runs in its release mode, removing the library code the app never calls
        // and resources nobody uses. The app's, Capacitor's and the plugins' classes keep their names (proguard-phone.pro), so nothing
        // they load by name breaks; library classes may be renamed. It is signed with the local debug key, as the debug build is,
        // so either one installs over the other. About a quarter of the debug APK's size, small enough for a Google Drive
        // upload from here (10 MB). scripts/build-android.mjs --phone builds it; assembleDebug and the release build are unchanged.
        phone {
            initWith debug
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-phone.pro'
            ndk { abiFilters 'arm64-v8a' }
            matchingFallbacks = ['debug']
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingEnv) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// The phone build stores its native libraries compressed (the phone unpacks them when it installs the app), which takes about
// 2.5 MB off the APK; the other builds keep them uncompressed, as before.
androidComponents {
    onVariants(selector().withBuildType('phone')) { variant ->
        variant.packaging.jniLibs.useLegacyPackaging.set(true)
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
