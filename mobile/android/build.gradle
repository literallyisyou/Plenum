// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // variables.gradle holds the versions, kotlin_version among them; it is read here too, so the Kotlin Gradle plugin is put on
    // the root classpath once, in one version, and the three Plenum plugin modules use that one (wave 4, k1).
    apply from: "variables.gradle"

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // No Google services: Plenum uses no Firebase. Push comes through UnifiedPush (mobile/plugins/unifiedpush).

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
